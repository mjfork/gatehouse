repo = "https://github.com/mjfork/trk"
commit = "9a3c329cdb6495e6ade62dfaf375498ab01c95c9"

[hx]
repo = "https://github.com/mjfork/hx"
commit = "ff63de95be9adb7b87bc67d6260b97fbc3dc2646"

[workbench]
